name: Deploy tolyqadam
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: appleboy/ssh-action@master
        with:
          host: ta.commit.kz
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: /var/www/tolyqadam/update.sh
